<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>雾灯小镇 · 像素剧情小游戏</title>
<style>
:root{color-scheme:dark;--bg:#111e23;--panel:#192b30;--line:#365052;--ink:#eee9d7;--muted:#9bb1af;--gold:#e6bd7a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 25% 20%,#263f41,transparent 65%),var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-size:14px;min-height:100vh}button{font:inherit;cursor:pointer;background:#253c40;color:var(--ink);border:1px solid #4a6363;border-radius:5px;padding:10px 14px}button:hover{background:#375453;border-color:var(--gold)}button:focus-visible,canvas:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.4;cursor:default}.page{max-width:1230px;margin:auto;padding:32px 34px 22px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.eyebrow{font-size:10px;letter-spacing:4px;color:var(--gold);margin-bottom:8px}h1{font-family:serif;font-size:32px;letter-spacing:7px;margin:0 0 6px}header p{margin:0;color:var(--muted);font-size:12px}.badge{font-size:11px;letter-spacing:2px;border:1px solid var(--line);padding:9px 12px;color:var(--muted)}main{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px}.game{border:1px solid #4a6363;background:#162d30;border-radius:8px;overflow:hidden;box-shadow:0 25px 70px #0004}.bar{display:flex;justify-content:space-between;align-items:center;padding:13px 17px;background:#1a2c31;font-size:12px}.bar span:last-child{color:var(--gold);font-size:11px}.stage{position:relative;background:#314d43;line-height:0}#map{display:block;width:100%;height:auto;image-rendering:pixelated;outline-offset:-4px}.hint{line-height:1.6;text-align:center;min-height:43px;padding:12px;background:#1a2c31;color:#b9cebd;font-size:12px}kbd{font-family:inherit;background:#354c4b;border:1px solid #566963;border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:#f2ddb1;margin:0 3px}.side{display:flex;flex-direction:column;gap:16px}.card{border:1px solid var(--line);border-radius:7px;background:#1a2c30;padding:20px}.label{font-size:10px;color:var(--gold);letter-spacing:3px;margin-bottom:16px}.card h2{font-size:17px;font-family:serif;margin:0 0 12px}.card p{line-height:1.9;color:#b8c9c4;margin:8px 0;font-size:12px}.dots{display:flex;gap:7px;margin-top:21px}.dot{height:4px;flex:1;background:#38504d}.dot.done{background:var(--gold)}.inventory{border-top:1px solid var(--line);padding-top:12px;margin-top:16px;color:#d6cfb9;font-size:12px}.people{display:flex;flex-direction:column;gap:16px}.person{display:flex;align-items:center;gap:11px}.avatar{width:23px;height:27px;clip-path:polygon(25% 0,75% 0,75% 23%,100% 23%,100% 80%,75% 80%,75% 100%,25% 100%,25% 80%,0 80%,0 23%,25% 23%)}.person strong{display:block;font-size:12px;font-weight:normal;margin-bottom:4px}.person small{font-size:10px;color:var(--muted)}.saveButtons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.saveButtons button{font-size:12px}.quiet{background:transparent;border-color:#365052;color:var(--muted)}.saveMeta{min-height:32px;font-size:10px!important;color:var(--muted)!important}.footer{display:flex;justify-content:space-between;gap:20px;margin-top:20px;color:#819c9b;font-size:11px;line-height:2}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.controls button{padding:8px 15px}.controls .action{margin-left:auto;color:var(--gold)}#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#eee3c8;color:#203735;border:1px solid #fff6d9;padding:12px 22px;border-radius:6px;z-index:20;box-shadow:0 8px 30px #0005;max-width:90vw;line-height:1.6}dialog{border:1px solid #739089;border-radius:9px;background:#182e32;color:var(--ink);padding:0;max-width:min(660px,94vw);width:660px;box-shadow:0 30px 120px #0009}dialog::backdrop{background:#071619b3;backdrop-filter:blur(3px)}.sceneHead{display:flex;justify-content:space-between;align-items:center;padding:15px 22px;font-size:11px;color:var(--gold);letter-spacing:1px}.sceneHead button{padding:5px 9px;font-size:11px}#illustration{height:184px;position:relative;overflow:hidden;background:#35515b;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;image-rendering:pixelated;border-top:1px solid #55716b;border-bottom:1px solid #55716b}#illustration[hidden]{display:none}#illustration canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}#illustration img{width:100%;height:100%;object-fit:cover;position:absolute}#illustration .artCaption{position:absolute;bottom:10px;left:16px;font-size:10px;color:#ede2c7;background:#172b32b8;padding:5px 8px}.dialogBody{padding:23px 26px 20px}#speaker{font-size:14px;color:var(--gold);margin-bottom:13px}#line{font-size:16px;line-height:1.9;min-height:88px;margin:0}.dialogFoot{display:flex;align-items:center;justify-content:space-between;margin-top:18px}.dialogFoot small{color:var(--muted);font-size:11px}.dialogFoot button{background:#dcc08a;color:#243632;border:0;padding:10px 24px}#confirm .dialogBody p{line-height:1.8;color:#b8c9c4}.confirmActions{display:flex;gap:10px;justify-content:flex-end}#ending{color:var(--gold)}[hidden]{display:none!important}@media(max-width:900px){.page{padding:22px 16px}main{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .card:last-child{grid-column:1/-1}.people{gap:10px}.footer{flex-direction:column;gap:0}.badge{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="page">
<header><div><div class="eyebrow">A LITTLE PIXEL STORY</div><h1>雾灯小镇</h1><p>一封没有寄出的信 · 约 5 分钟的小小冒险</p></div><div class="badge">离线可玩 / 本地存档</div></header>
<main>
<section aria-label="游戏地图与操作"><div class="game"><div class="bar"><span>● 河畔小镇</span><span id="timeLabel">暮色 17:42</span></div><div class="stage"><canvas id="map" width="768" height="544" tabindex="0" aria-label="像素地图。方向键或 WASD 移动，E 或空格互动。"></canvas></div><div class="hint" id="hint" aria-live="polite">方向键 / WASD 移动，靠近人物按 E 对话</div></div><div class="controls" aria-label="屏幕控制"><button data-move="left" aria-label="向左">←</button><button data-move="up" aria-label="向上">↑</button><button data-move="down" aria-label="向下">↓</button><button data-move="right" aria-label="向右">→</button><button id="interact" class="action">互动 <kbd>E</kbd></button></div></section>
<aside class="side"><section class="card"><div class="label">YOUR JOURNEY / 当前任务</div><h2 id="questTitle">等待亮起的雾灯</h2><p id="quest"></p><div class="dots" id="dots"></div><div class="inventory">随身物品：<span id="bag">暂无</span></div><p id="ending" hidden>第一章 · 完成<br>故事暂告一段落，小镇仍可自由探索。</p></section><section class="card"><div class="label">PEOPLE / 小镇居民</div><div class="people" id="people"></div></section><section class="card"><div class="label">MEMORY / 旅途记忆</div><div class="saveButtons"><button id="save">保存进度</button><button id="load">读取存档</button><button id="export" class="quiet">导出存档</button><button id="import" class="quiet">导入存档</button></div><input id="file" type="file" accept=".json,application/json" hidden><p class="saveMeta" id="saveMeta">剧情完成后自动保存，也可随时手动保存。</p><button id="restart" class="quiet" style="width:100%;font-size:11px">重新开始</button></section></aside>
</main><div class="footer"><span><kbd>↑ ↓ ← →</kbd> / <kbd>W A S D</kbd> 移动　<kbd>E</kbd> / <kbd>空格</kbd> 对话　<kbd>Esc</kbd> 暂停对话</span><span>一张地图 · 三位居民 · 一个关于等待的故事</span></div>
</div>
<dialog id="dialog" aria-label="剧情对话"><div class="sceneHead"><span id="sceneTitle"></span><button id="closeDialog" class="quiet">稍后再聊 ×</button></div><div id="illustration" hidden></div><div class="dialogBody"><div id="speaker"></div><p id="line"></p><div class="dialogFoot"><small id="pageNo"></small><button id="next">继续 →</button></div></div></dialog>
<dialog id="confirm" aria-labelledby="confirmTitle"><div class="dialogBody"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="confirmActions"><button id="cancelConfirm" class="quiet">取消</button><button id="acceptConfirm">确定</button></div></div></dialog>
<div id="toast" role="status" hidden></div>
<script src="story.js"></script><script src="game.js"></script>
</body></html>
